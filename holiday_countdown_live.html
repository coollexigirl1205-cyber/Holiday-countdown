<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holiday Countdown 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:24px;transition:.5s;background:#17110f;color:#fff}
main{width:min(760px,100%);text-align:center}.emoji{font-size:72px}.label{font-size:18px;opacity:.8}.name{font-size:42px;font-weight:800;margin:5px 0 14px}.timer{font-size:clamp(30px,8vw,62px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}.date{margin-top:14px;font-size:18px;opacity:.8}.next{margin-top:34px;font-size:15px;opacity:.65}
.card{padding:34px 22px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff25;backdrop-filter:blur(12px)}
</style>
</head>
<body><main><section class="card">
<div class="emoji" id="emoji"></div><div class="label">NEXT HOLIDAY</div>
<div class="name" id="name"></div><div class="timer" id="timer"></div>
<div class="date" id="date"></div><div class="next">The theme automatically changes when the next holiday arrives ✨</div>
</section></main>
<script>
const holidays=[
{date:"2026-09-07T00:00:00",name:"Labor Day",emoji:"🧑‍🏭",bg:"#172554"},
{date:"2026-10-12T00:00:00",name:"Columbus Day",emoji:"⛵",bg:"#164e63"},
{date:"2026-10-31T00:00:00",name:"Halloween",emoji:"🎃",bg:"#241006"},
{date:"2026-11-11T00:00:00",name:"Veterans Day",emoji:"🇺🇸",bg:"#450a0a"},
{date:"2026-11-26T00:00:00",name:"Thanksgiving",emoji:"🦃",bg:"#431407"},
{date:"2026-12-24T00:00:00",name:"Christmas Eve",emoji:"🎅",bg:"#064e3b"},
{date:"2026-12-25T00:00:00",name:"Christmas",emoji:"🎄",bg:"#052e16"},
{date:"2026-12-31T00:00:00",name:"New Year's Eve",emoji:"🎉",bg:"#1e1b4b"}];
function update(){
 const now=new Date();
 let h=holidays.find(x=>new Date(x.date)>now);
 if(!h){h={date:"2027-01-01T00:00:00",name:"New Year's Day",emoji:"🎆",bg:"#172554"}}
 let ms=Math.max(0,new Date(h.date)-now);
 let total=Math.floor(ms/1000),d=Math.floor(total/86400);total%=86400;
 let hh=Math.floor(total/3600);total%=3600;let mm=Math.floor(total/60);let ss=total%60;
 document.body.style.background=h.bg;
 document.getElementById("emoji").textContent=h.emoji;
 document.getElementById("name").textContent=h.name;
 document.getElementById("timer").textContent=`${d}d ${String(hh).padStart(2,"0")}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
 document.getElementById("date").textContent=new Date(h.date).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
update();setInterval(update,1000);
</script></body></html>
