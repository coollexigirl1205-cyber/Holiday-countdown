<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Holiday Countdown ✨</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  min-height:100vh;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  color:white;

  background:#222 center/cover fixed no-repeat;

  transition:background-image .8s ease;

}

body:after{

  content:"";

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.18);

  pointer-events:none;

  z-index:0;

}

main{

  position:relative;

  z-index:1;

  width:min(1150px,94%);

  margin:auto;

  padding:18px 0 50px;

}

/* CURRENT DATE */

.today{

  text-align:right;

  font-size:16px;

  font-weight:900;

  margin:0 5px 12px;

  text-shadow:0 2px 8px rgba(0,0,0,.45);

}

/* BIG HOLIDAY */

.hero{

  min-height:430px;

  position:relative;

  overflow:hidden;

  border-radius:34px;

  display:flex;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:35px 20px;

  background:rgba(0,0,0,.22);

  border:2px solid rgba(255,255,255,.35);

  box-shadow:

    0 20px 60px rgba(0,0,0,.35),

    inset 0 0 40px rgba(255,255,255,.08);

  backdrop-filter:blur(3px);

}

.heroContent{

  position:relative;

  z-index:2;

}

.label{

  margin-top:8px;

  font-size:17px;

  font-weight:950;

  letter-spacing:5px;

}

.name{

  font-size:clamp(45px,8vw,82px);

  line-height:1;

  font-weight:950;

  margin:12px 0 18px;

  text-shadow:0 5px 18px rgba(0,0,0,.45);

}

.timer{

  font-size:clamp(27px,6vw,57px);

  font-weight:950;

  text-shadow:0 4px 14px rgba(0,0,0,.45);

}

.bigDate{

  margin-top:14px;

  font-size:20px;

  font-weight:800;

}

/* HOLIDAY CARDS */

h2{

  text-align:center;

  font-size:30px;

  margin:40px 0 18px;

  text-shadow:0 3px 10px rgba(0,0,0,.4);

}

.holidays{

  display:grid;

  grid-template-columns:repeat(5,1fr);

  gap:15px;

}

.holiday{

  min-height:175px;

  padding:18px 10px;

  border-radius:23px;

  background:rgba(0,0,0,.28);

  border:1px solid rgba(255,255,255,.35);

  backdrop-filter:blur(8px);

  box-shadow:

    0 10px 25px rgba(0,0,0,.25);

  text-align:center;

}

.holidayEmoji{

  font-size:40px;

}

.holidayName{

  font-size:16px;

  font-weight:950;

  margin-top:8px;

}

.holidayDate{

  margin-top:5px;

  font-size:12px;

  font-weight:800;

}

.holidayCountdown{

  margin-top:11px;

  font-size:13px;

  font-weight:900;

  line-height:1.35;

}

/* TABLET / PHONE */

@media(max-width:850px){

  .holidays{

    grid-template-columns:repeat(2,1fr);

  }

}

@media(max-width:500px){

  .hero{

    min-height:380px;

  }

  .holidays{

    grid-template-columns:repeat(2,1fr);

    gap:10px;

  }

  .holiday{

    min-height:160px;

  }

}

</style>

</head>

<body>

<main>

<div class="today" id="today"></div>

<section class="hero">

  <div class="heroContent">

    <!-- NO EMOJI ON BIG SCREEN -->

    <div class="label" id="label">

      NEXT HOLIDAY

    </div>

    <div class="name" id="name"></div>

    <div class="timer" id="timer"></div>

    <div class="bigDate" id="bigDate"></div>

  </div>

</section>

<h2>🎉 Upcoming Holidays</h2>

<div class="holidays" id="holidayList"></div>

</main>

<script>

/* ==================================================

   HOLIDAYS + YOUR PICTURES

   ================================================== */

const holidays = [

  {

    date:"2026-09-07T00:00:00",

    name:"Labor Day",

    emoji:"👷",

    image:"labor-day.jpg",

    dateColor:"#fff4d6"

  },

  {

    date:"2026-09-22T00:00:00",

    name:"First Day of Fall",

    emoji:"🍂",

    image:"fall.jpg",

    season:true,

    dateColor:"#fff0c9"

  },

  {

    date:"2026-10-12T00:00:00",

    name:"Columbus Day",

    emoji:"⛵",

    image:"columbus-day.jpg",

    dateColor:"#ffe7b3"

  },

  {

    date:"2026-10-31T00:00:00",

    name:"Halloween",

    emoji:"🎃",

    image:"halloween.jpg",

    dateColor:"#ffb347"

  },

  {

    date:"2026-11-11T00:00:00",

    name:"Veterans Day",

    emoji:"🇺🇸",

    image:"veterans-day.jpg",

    dateColor:"#fff1d6"

  },

  {

    date:"2026-11-26T00:00:00",

    name:"Thanksgiving",

    emoji:"🦃",

    image:"thanksgiving.jpg",

    dateColor:"#ffd39b"

  },

  {

    date:"2026-12-21T00:00:00",

    name:"First Day of Winter",

    emoji:"❄️",

    image:"winter.jpg",

    season:true,

    dateColor:"#e8f7ff"

  },

  {

    date:"2026-12-24T00:00:00",

    name:"Christmas Eve",

    emoji:"🎅",

    image:"christmas-eve.jpg",

    dateColor:"#fff0d0"

  },

  {

    date:"2026-12-25T00:00:00",

    name:"Christmas",

    emoji:"🎄",

    image:"christmas.jpg",

    dateColor:"#fff4c2"

  },

  {

    date:"2026-12-31T00:00:00",

    name:"New Year's Eve",

    emoji:"🎉",

    image:"new-years-eve.jpg",

    dateColor:"#ffffff"

  },

  {

    date:"2027-01-01T00:00:00",

    name:"New Year's Day",

    emoji:"🎆",

    image:"new-years-day.jpg",

    dateColor:"#fff4c2"

  }

];

/* ==================================================

   FORMAT EXACT COUNTDOWN

   ================================================== */

function countdownText(targetDate, now){

  const target = new Date(targetDate);

  const todayStart = new Date(

    now.getFullYear(),

    now.getMonth(),

    now.getDate()

  );

  const targetStart = new Date(

    target.getFullYear(),

    target.getMonth(),

    target.getDate()

  );

  const days = Math.round(

    (targetStart - todayStart) / 86400000

  );

  /* ACTUAL HOLIDAY */

  if(days === 0){

    return null;

  }

const diff = target - now;

const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
const minutes = Math.floor(diff / (1000 * 60)) % 60;
const seconds = Math.floor(diff / 1000) % 60;

return `${days} DAYS • ${hours} HOURS • ${minutes} MINUTES • ${seconds} SECONDS`;

  



/* ==================================================

   FULL SECOND-BY-SECOND COUNTDOWN

   Used only for cards when not at a week milestone.

   ================================================== */

function detailedTime(ms){

  ms=Math.max(0,ms);

  let seconds=Math.floor(ms/1000);

  const days=Math.floor(seconds/86400);

  seconds%=86400;

  const hours=Math.floor(seconds/3600);

  seconds%=3600;

  const minutes=Math.floor(seconds/60);

  const secs=seconds%60;

  return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m ${String(secs).padStart(2,"0")}s`;

}

/* ==================================================

   DATE

   ================================================== */

function formatDate(date){

  return new Date(date).toLocaleDateString(undefined,{

    weekday:"long",

    month:"long",

    day:"numeric",

    year:"numeric"

  });

}

/* ==================================================

   SAME DAY

   ================================================== */

function sameDay(a,b){

  return a.getFullYear()===b.getFullYear() &&

         a.getMonth()===b.getMonth() &&

         a.getDate()===b.getDate();

}

/* ==================================================

   GET CURRENT HOLIDAY

   ================================================== */

function getCurrentHoliday(now){

  return holidays.find(holiday =>

    sameDay(now,new Date(holiday.date))

  ) || null;

}

/* ==================================================

   GET NEXT HOLIDAY

   ================================================== */

function getNextHoliday(now){

  return holidays.find(holiday =>

    new Date(holiday.date) > now

  ) || null;

}

/* ==================================================

   HAPPY / MERRY MESSAGE

   ================================================== */

function celebrationMessage(holiday){

  const name = holiday.name;

  if(name === "Christmas"){

    return "MERRY CHRISTMAS!";

  }

  if(name === "Christmas Eve"){

    return "MERRY CHRISTMAS EVE!";

  }

  return `HAPPY ${name.toUpperCase()}!`;

}

/* ==================================================

   TODAY

   ================================================== */

function updateToday(now){

  document.getElementById("today").textContent =

    "Today • " +

    now.toLocaleDateString(undefined,{

      weekday:"long",

      month:"long",

      day:"numeric",

      year:"numeric"

    });

}

/* ==================================================

   BIG SCREEN

   ================================================== */

function updateBig(now){

  const current = getCurrentHoliday(now);

  const next = getNextHoliday(now);

  const shown = current || next;

  if(!shown) return;

  /* BACKGROUND */

  document.body.style.backgroundImage =

    `url("${shown.image}")`;

  /* MATCHING DATE COLOR */

  document.getElementById("today").style.color =

    shown.dateColor;

  /* HOLIDAY NAME */

  document.getElementById("name").textContent =

    shown.name;

  /* DATE */

  document.getElementById("bigDate").textContent =

    formatDate(shown.date);

  /* ACTUAL HOLIDAY */

  if(current){

    document.getElementById("label").textContent =

      celebrationMessage(current);

    document.getElementById("timer").textContent =

      "";

    return;

  }

  /* COUNTDOWN */

  document.getElementById("label").textContent =

    "NEXT HOLIDAY";

  document.getElementById("timer").textContent =

    countdownText(shown.date,now);

}

/* ==================================================

   LITTLE CARDS

   ================================================== */

function updateCards(now){

  const list =

    document.getElementById("holidayList");

  list.innerHTML="";

  const current = getCurrentHoliday(now);

  const next = getNextHoliday(now);

  holidays.forEach(holiday => {

    const target = new Date(holiday.date);

    /* PAST HOLIDAYS DISAPPEAR */

    if(target < now && !sameDay(now,target)){

      return;

    }

    /* BIG SCREEN HOLIDAY DOES NOT GET A CARD */

    if(

      (current && holiday === current) ||

      (!current && holiday === next)

    ){

      return;

    }

    const card =

      document.createElement("div");

    card.className="holiday";

    card.innerHTML=`

      <div class="holidayEmoji">

        ${holiday.emoji}

      </div>

      <div class="holidayName">

        ${holiday.name}

      </div>

      <div

        class="holidayDate"

        style="color:${holiday.dateColor}">

        ${new Date(holiday.date)

          .toLocaleDateString(undefined,{

            month:"long",

            day:"numeric",

            year:"numeric"

          })}

      </div>

      <div

        class="holidayCountdown"

        data-date="${holiday.date}">

        ${countdownText(holiday.date,now) || "TODAY"}

      </div>

    `;

    list.appendChild(card);

  });

}

/* ==================================================

   UPDATE EVERYTHING

   ================================================== */

function update(){

  const now = new Date();

  updateToday(now);

  updateBig(now);

  updateCards(now);

}

/* ==================================================

   START

   ================================================== */

update();

/* UPDATE EVERY SECOND */

setInterval(()=>{

  const now = new Date();

  updateToday(now);

  updateBig(now);

  document

    .querySelectorAll(".holidayCountdown")

    .forEach(counter => {

      const target =

        new Date(counter.dataset.date);

      if(target <= now){

        counter

          .closest(".holiday")

          ?.remove();

      }

      else{

        counter.textContent =

          countdownText(

            counter.dataset.date,

            now

          );

      }

    });

},1000);

/* REFRESH CARDS */

setInterval(update,60000);

</script>

</body>

</html>
