<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Holiday Countdown ✨</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  transition:background 1s ease;
  background:#24104f;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 10% 15%,rgba(255,255,255,.18),transparent 22%),
    radial-gradient(circle at 90% 25%,rgba(255,255,255,.12),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(255,255,255,.1),transparent 30%);
}

main{
  width:min(1100px,94%);
  margin:auto;
  padding:20px 0 60px;
  text-align:center;
  position:relative;
}

.today{
  text-align:right;
  font-size:16px;
  font-weight:800;
  opacity:.78;
  margin:0 6px 12px;
}

.card{
  position:relative;
  overflow:hidden;
  padding:42px 22px 34px;
  border-radius:36px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(18px);
  box-shadow:
    0 25px 70px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.25);
}

.card:before,
.card:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:white;
  opacity:.12;
  filter:blur(5px);
}

.card:before{
  width:260px;
  height:260px;
  top:-150px;
  left:-100px;
}

.card:after{
  width:300px;
  height:300px;
  bottom:-200px;
  right:-120px;
}

.sparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
  font-size:22px;
  opacity:.65;
}

.sparkles span{
  position:absolute;
  animation:float 4s ease-in-out infinite;
}

.sparkles span:nth-child(1){top:12%;left:9%}
.sparkles span:nth-child(2){top:25%;right:10%;animation-delay:1s}
.sparkles span:nth-child(3){bottom:18%;left:14%;animation-delay:2s}
.sparkles span:nth-child(4){bottom:15%;right:15%;animation-delay:3s}

@keyframes float{
  50%{transform:translateY(-10px) rotate(8deg)}
}

.emoji{
  font-size:76px;
  position:relative;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));
}

.label{
  margin-top:8px;
  font-size:17px;
  font-weight:950;
  letter-spacing:5px;
  opacity:.9;
  position:relative;
}

.name{
  font-size:clamp(45px,8vw,82px);
  font-weight:950;
  line-height:1;
  margin:14px 0;
  position:relative;
  text-shadow:0 7px 20px rgba(0,0,0,.2);
}

.timer{
  font-size:clamp(27px,6vw,58px);
  font-weight:950;
  margin:20px 0;
  position:relative;
  letter-spacing:1px;
  text-shadow:0 5px 15px rgba(0,0,0,.2);
}

.date{
  font-size:20px;
  font-weight:700;
  opacity:.92;
  position:relative;
}

.message{
  margin-top:18px;
  font-size:15px;
  font-weight:750;
  opacity:.85;
  position:relative;
}

h2{
  margin:42px 0 18px;
  font-size:32px;
  font-weight:950;
}

.holidays{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:16px;
}

.holiday{
  position:relative;
  overflow:hidden;
  padding:22px 14px;
  min-height:185px;
  border-radius:25px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(12px);
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  transition:transform .25s ease,box-shadow .25s ease;
}

.holiday:before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:white;
  opacity:.08;
  top:-55px;
  right:-35px;
}

.holiday:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.holiday span{
  display:block;
  font-size:43px;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.2));
}

.holiday strong{
  display:block;
  margin-top:9px;
  font-size:18px;
  font-weight:900;
}

.holiday small{
  display:block;
  margin-top:6px;
  opacity:.82;
  font-size:13px;
}

.countdown{
  margin-top:12px;
  font-size:14px;
  font-weight:900;
  line-height:1.35;
}

.special{
  box-shadow:
    0 0 0 2px rgba(255,255,255,.3),
    0 15px 40px rgba(0,0,0,.25);
}

.note{
  margin-top:28px;
  font-size:13px;
  opacity:.65;
}

@media(max-width:600px){
  main{padding-top:12px}
  .today{font-size:13px}
  .card{padding:30px 14px}
  .emoji{font-size:60px}
  h2{font-size:27px}
  .holidays{grid-template-columns:repeat(2,1fr)}
  .holiday{min-height:175px}
}
</style>
</head>

<body>

<main>

<div class="today" id="today"></div>

<section class="card">

<div class="sparkles">
<span>✨</span>
<span>✦</span>
<span>✨</span>
<span>✦</span>
</div>

<div class="emoji" id="emoji"></div>

<div class="label" id="label">NEXT HOLIDAY</div>

<div class="name" id="name"></div>

<div class="timer" id="timer"></div>

<div class="date" id="date"></div>

<div class="message" id="message"></div>

</section>

<h2>🎉 Upcoming Holidays</h2>

<div class="holidays" id="holidayList"></div>

<div class="note">
Past holidays automatically disappear ✨
</div>

</main>

<script>

const holidays = [

{
date:"2026-09-07T00:00:00",
name:"Labor Day",
emoji:"👷",
bg:"linear-gradient(135deg,#312e81,#4f46e5,#7c3aed)"
},

{
date:"2026-09-22T00:00:00",
name:"First Day of Fall",
emoji:"🍂",
bg:"linear-gradient(135deg,#7c2d12,#b45309,#92400e)",
season:true
},

{
date:"2026-10-12T00:00:00",
name:"Columbus Day",
emoji:"⛵",
bg:"linear-gradient(135deg,#164e63,#0369a1,#155e75)"
},

{
date:"2026-10-31T00:00:00",
name:"Halloween",
emoji:"🎃",
bg:"linear-gradient(135deg,#1f0638,#581c87,#7e22ce)"
},

{
date:"2026-11-11T00:00:00",
name:"Veterans Day",
emoji:"🇺🇸",
bg:"linear-gradient(135deg,#450a0a,#991b1b,#1e3a8a)"
},

{
date:"2026-11-26T00:00:00",
name:"Thanksgiving",
emoji:"🦃",
bg:"linear-gradient(135deg,#431407,#9a3412,#c2410c)"
},

{
date:"2026-12-21T00:00:00",
name:"First Day of Winter",
emoji:"❄️",
bg:"linear-gradient(135deg,#172554,#1d4ed8,#0c4a6e)",
season:true
},

{
date:"2026-12-24T00:00:00",
name:"Christmas Eve",
emoji:"🎅",
bg:"linear-gradient(135deg,#064e3b,#047857,#166534)"
},

{
date:"2026-12-25T00:00:00",
name:"Christmas",
emoji:"🎄",
bg:"linear-gradient(135deg,#052e16,#15803d,#166534)"
},

{
date:"2026-12-31T00:00:00",
name:"New Year's Eve",
emoji:"🎉",
bg:"linear-gradient(135deg,#1e1b4b,#4338ca,#6d28d9)"
},

{
date:"2027-01-01T00:00:00",
name:"New Year's Day",
emoji:"🎆",
bg:"linear-gradient(135deg,#172554,#3730a3,#1d4ed8)"
}

];

function formatTime(ms){

ms=Math.max(0,ms);

let seconds=Math.floor(ms/1000);

const days=Math.floor(seconds/86400);

seconds%=86400;

const hours=Math.floor(seconds/3600);

seconds%=3600;

const minutes=Math.floor(seconds/60);

const secs=seconds%60;

return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m ${String(secs).padStart(2,"0")}s`;

}

function formatDate(date){

return new Date(date).toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});

}

function sameDay(a,b){

return a.getFullYear()===b.getFullYear() &&
a.getMonth()===b.getMonth() &&
a.getDate()===b.getDate();

}

function daysUntil(target,now){

return Math.ceil((target-now)/86400000);

}

function getSpecial(now){

for(const holiday of holidays){

const date=new Date(holiday.date);

if(sameDay(now,date)){

return holiday;

}

if(holiday.season && daysUntil(date,now)===1){

return holiday;

}

}

return null;

}

function getNext(now){

return holidays.find(
holiday=>new Date(holiday.date)>now
);

}

function updateToday(now){

document.getElementById("today").textContent =
"Today • " +
now.toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});

}

function updateBig(now){

const special=getSpecial(now);
const next=getNext(now);
const shown=special || next;

if(!shown)return;

document.body.style.background=shown.bg;

document.getElementById("emoji").textContent=shown.emoji;

document.getElementById("name").textContent=shown.name;

if(special){

const today=sameDay(now,new Date(special.date));

document.getElementById("label").textContent=
today ? "TODAY" : "COMING TOMORROW";

document.getElementById("timer").textContent=
today ? "🎉 TODAY! 🎉" : "1 DAY";

document.getElementById("message").textContent=
today
? "✨ Happy "+special.name+"! ✨"
: "✨ Get ready — tomorrow is "+special.name+"! ✨";

}else{

document.getElementById("label").textContent="NEXT HOLIDAY";

document.getElementById("timer").textContent=
formatTime(new Date(shown.date)-now);

document.getElementById("message").textContent=
"✨ Countdown updates every second ✨";

}

document.getElementById("date").textContent=
formatDate(shown.date);

}

function updateList(now){

const list=document.getElementById("holidayList");

list.innerHTML="";

const upcoming=holidays.filter(
holiday=>new Date(holiday.date)>now
);

upcoming.forEach((holiday,index)=>{

const div=document.createElement("div");

div.className="holiday"+(index===0?" special":"");

div.innerHTML=`

<span>${holiday.emoji}</span>

<strong>${holiday.name}</strong>

<small>
${new Date(holiday.date).toLocaleDateString(undefined,{
month:"long",
day:"numeric",
year:"numeric"
})}
</small>

<div class="countdown"
data-date="${holiday.date}">
${formatTime(new Date(holiday.date)-now)}
</div>

`;

list.appendChild(div);

});

}

function updateSmallCountdowns(now){

document.querySelectorAll(".countdown").forEach(element=>{

const target=new Date(element.dataset.date);

if(target<=now){

element.closest(".holiday")?.remove();

}else{

element.textContent=formatTime(target-now);

}

});

}

function updateAll(){

const now=new Date();

updateToday(now);
updateBig(now);
updateList(now);

}

updateAll();

setInterval(()=>{

const now=new Date();

updateToday(now);
updateBig(now);
updateSmallCountdowns(now);

},1000);

</script>

</body>
</html>
