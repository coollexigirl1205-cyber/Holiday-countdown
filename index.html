<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holiday Countdown</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  background:#172554;
  transition:background 1s ease;
}

main{
  width:min(1100px,94%);
  margin:auto;
  padding:18px 0 50px;
}

/* TODAY */

.today{
  text-align:right;
  font-size:15px;
  font-weight:700;
  opacity:.85;
  margin-bottom:10px;
}

/* BIG FEATURE */

.hero{
  position:relative;
  min-height:430px;
  border-radius:35px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 20px;
  background:
    linear-gradient(
      180deg,
      rgba(30,64,175,.95),
      rgba(127,29,29,.9)
    );
  box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

/* DECORATIVE BACKGROUND */

.hero:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.35) 0 4px,transparent 5px),
    radial-gradient(circle at 80% 18%,rgba(255,255,255,.25) 0 5px,transparent 6px),
    radial-gradient(circle at 30% 80%,rgba(255,255,255,.2) 0 4px,transparent 5px),
    radial-gradient(circle at 75% 75%,rgba(255,255,255,.2) 0 4px,transparent 5px);

  opacity:.8;
}

.hero:after{
  content:"";
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-80px;
  height:180px;

  background:rgba(255,255,255,.13);

  border-radius:50% 50% 0 0;
}

/* DECORATIVE FLAGS */

.flags{
  position:absolute;
  top:18px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:15px;
  font-size:32px;
  opacity:.9;
}

.hero-content{
  position:relative;
  z-index:2;
}

.big-emoji{
  font-size:90px;
  filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));
}

.small-label{
  margin-top:8px;
  font-size:17px;
  font-weight:900;
  letter-spacing:4px;
}

.big-name{
  font-size:clamp(45px,8vw,82px);
  font-weight:950;
  margin:8px 0 15px;
  text-shadow:0 6px 20px rgba(0,0,0,.3);
}

.big-timer{
  font-size:clamp(27px,6vw,57px);
  font-weight:900;
  text-shadow:0 5px 15px rgba(0,0,0,.25);
}

.big-date{
  margin-top:12px;
  font-size:20px;
  font-weight:700;
}

/* HOLIDAY TITLE */

h2{
  text-align:center;
  font-size:30px;
  margin:40px 0 18px;
}

/* EXACTLY TWO ROWS */

.holidays{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

/* HOLIDAY CARDS */

.holiday{
  min-height:175px;
  padding:20px 12px;
  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.2),
      rgba(255,255,255,.08)
    );

  border:1px solid rgba(255,255,255,.28);

  box-shadow:
    0 10px 30px rgba(0,0,0,.2);

  text-align:center;
}

.holiday-icon{
  font-size:42px;
}

.holiday-name{
  font-size:17px;
  font-weight:900;
  margin-top:8px;
}

.holiday-date{
  font-size:13px;
  opacity:.78;
  margin-top:5px;
}

.holiday-countdown{
  font-size:14px;
  font-weight:800;
  margin-top:12px;
}

.passed{
  display:none;
}

/* MOBILE */

@media(max-width:850px){

  .holidays{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:500px){

  .hero{
    min-height:380px;
  }

  .big-emoji{
    font-size:70px;
  }

  .holidays{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .holiday{
    min-height:165px;
  }

}

</style>
</head>

<body>

<main>

<div class="today" id="today"></div>

<section class="hero">

<div class="flags">
🇺🇸 ✦ 🇺🇸 ✦ 🇺🇸
</div>

<div class="hero-content">

<div class="big-emoji" id="bigEmoji"></div>

<div class="small-label" id="bigLabel">
NEXT HOLIDAY
</div>

<div class="big-name" id="bigName"></div>

<div class="big-timer" id="bigTimer"></div>

<div class="big-date" id="bigDate"></div>

</div>

</section>

<h2>🎉 Upcoming Holidays</h2>

<div class="holidays" id="holidayList"></div>

</main>


<script>

const holidays=[

{
date:"2026-09-07T00:00:00",
name:"Labor Day",
emoji:"👷",
background:"linear-gradient(135deg,#172554,#1d4ed8,#991b1b)"
},

{
date:"2026-09-22T00:00:00",
name:"First Day of Fall",
emoji:"🍂",
background:"linear-gradient(135deg,#7c2d12,#b45309,#451a03)",
season:true
},

{
date:"2026-10-12T00:00:00",
name:"Columbus Day",
emoji:"⛵",
background:"linear-gradient(135deg,#164e63,#0369a1,#0c4a6e)"
},

{
date:"2026-10-31T00:00:00",
name:"Halloween",
emoji:"🎃",
background:"linear-gradient(135deg,#1f0638,#581c87,#111827)"
},

{
date:"2026-11-11T00:00:00",
name:"Veterans Day",
emoji:"🇺🇸",
background:"linear-gradient(135deg,#450a0a,#991b1b,#172554)"
},

{
date:"2026-11-26T00:00:00",
name:"Thanksgiving",
emoji:"🦃",
background:"linear-gradient(135deg,#431407,#c2410c,#78350f)"
},

{
date:"2026-12-21T00:00:00",
name:"First Day of Winter",
emoji:"❄️",
background:"linear-gradient(135deg,#172554,#2563eb,#dbeafe)",
season:true
},

{
date:"2026-12-24T00:00:00",
name:"Christmas Eve",
emoji:"🎅",
background:"linear-gradient(135deg,#064e3b,#047857,#991b1b)"
},

{
date:"2026-12-25T00:00:00",
name:"Christmas",
emoji:"🎄",
background:"linear-gradient(135deg,#052e16,#15803d,#991b1b)"
},

{
date:"2026-12-31T00:00:00",
name:"New Year's Eve",
emoji:"🎉",
background:"linear-gradient(135deg,#1e1b4b,#4338ca,#7c3aed)"
},

{
date:"2027-01-01T00:00:00",
name:"New Year's Day",
emoji:"🎆",
background:"linear-gradient(135deg,#172554,#3730a3,#2563eb)"
}

];


function formatTime(ms){

ms=Math.max(0,ms);

let seconds=Math.floor(ms/1000);

let days=Math.floor(seconds/86400);

seconds%=86400;

let hours=Math.floor(seconds/3600);

seconds%=3600;

let minutes=Math.floor(seconds/60);

let secs=seconds%60;

return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m ${String(secs).padStart(2,"0")}s`;

}


function formatDate(date){

return new Date(date).toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});

}


function sameDay(a,b){

return a.getFullYear()===b.getFullYear() &&
a.getMonth()===b.getMonth() &&
a.getDate()===b.getDate();

}


function getNextHoliday(now){

return holidays.find(h =>
new Date(h.date)>now
);

}


function getSpecialHoliday(now){

for(const h of holidays){

const date=new Date(h.date);

if(sameDay(now,date)){
return h;
}

if(
h.season &&
Math.ceil((date-now)/86400000)===1
){
return h;
}

}

return null;

}


function update(){

const now=new Date();

document.getElementById("today").textContent=
"Today • "+
now.toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});


const special=getSpecialHoliday(now);

const next=getNextHoliday(now);

const current=special || next;

if(!current)return;


document.body.style.background=current.background;


document.getElementById("bigEmoji").textContent=
current.emoji;


document.getElementById("bigName").textContent=
current.name;


document.getElementById("bigDate").textContent=
formatDate(current.date);


if(special){

const today=sameDay(
now,
new Date(special.date)
);

document.getElementById("bigLabel").textContent=
today
?"TODAY"
:"COMING TOMORROW";

document.getElementById("bigTimer").textContent=
today
?"🎉 TODAY! 🎉"
:"1 DAY";

}else{

document.getElementById("bigLabel").textContent=
"NEXT HOLIDAY";

document.getElementById("bigTimer").textContent=
formatTime(
new Date(current.date)-now
);

}


/* HOLIDAY BOXES */

const list=document.getElementById("holidayList");

list.innerHTML="";


holidays
.filter(h=>new Date(h.date)>now)
.forEach(h=>{

const box=document.createElement("div");

box.className="holiday";

box.innerHTML=`

<div class="holiday-icon">
${h.emoji}
</div>

<div class="holiday-name">
${h.name}
</div>

<div class="holiday-date">
${new Date(h.date).toLocaleDateString(undefined,{
month:"long",
day:"numeric",
year:"numeric"
})}
</div>

<div class="holiday-countdown"
data-date="${h.date}">
${formatTime(new Date(h.date)-now)}
</div>

`;

list.appendChild(box);

});

}


/* UPDATE THE LITTLE COUNTDOWNS EVERY SECOND */

setInterval(()=>{

const now=new Date();

document.querySelectorAll(".holiday-countdown")
.forEach(counter=>{

const target=new Date(counter.dataset.date);

if(target<=now){

counter.closest(".holiday").remove();

}else{

counter.textContent=
formatTime(target-now);

}

});

},1000);


update();

setInterval(update,1000);

</script>

</body>
</html>
