<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holiday Countdown 2026</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  color: white;

  transition: background 1s ease;

}

main {

  width: min(900px, 94%);

  margin: auto;

  padding: 35px 0;

  text-align: center;

}

.card {

  padding: 35px 22px;

  border-radius: 30px;

  background: rgba(255,255,255,0.14);

  border: 1px solid rgba(255,255,255,0.25);

  backdrop-filter: blur(12px);

  box-shadow: 0 15px 40px rgba(0,0,0,0.2);

}

.emoji {

  font-size: 75px;

}

.label {

  font-size: 18px;

  font-weight: 700;

  letter-spacing: 2px;

  opacity: 0.85;

}

.name {

  font-size: clamp(42px, 8vw, 75px);

  font-weight: 800;

  margin: 10px 0;

}

.timer {

  font-size: clamp(32px, 7vw, 62px);

  font-weight: 800;

  margin: 15px 0;

}

.date {

  font-size: 20px;

  opacity: 0.85;

}

h2 {

  margin-top: 45px;

  font-size: 28px;

}

.holidays {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

  gap: 14px;

  margin-top: 20px;

}

.holiday {

  padding: 18px;

  border-radius: 20px;

  background: rgba(255,255,255,0.12);

  border: 1px solid rgba(255,255,255,0.18);

}

.holiday span {

  display: block;

  font-size: 35px;

}

.holiday strong {

  display: block;

  margin-top: 7px;

  font-size: 17px;

}

.holiday small {

  opacity: 0.75;

}

.next {

  margin-top: 25px;

  opacity: 0.8;

  font-size: 15px;

}

</style>

</head>

<body>

<main>

<section class="card">

<div class="emoji" id="emoji"></div>

<div class="label">NEXT HOLIDAY</div>

<div class="name" id="name"></div>

<div class="timer" id="timer"></div>

<div class="date" id="date"></div>

<div class="next">

The theme automatically changes when the next holiday arrives ✨

</div>

</section>

<h2>🎉 2026 Holidays</h2>

<div class="holidays" id="holidayList"></div>

</main>

<script>

const holidays = [

{

date:"2026-09-07T00:00:00",

end:"2026-09-08T00:00:00",

name:"Labor Day",

emoji:"👷",

bg:"#172554"

},

{

date:"2026-10-12T00:00:00",

end:"2026-10-13T00:00:00",

name:"Columbus Day",

emoji:"⛵",

bg:"#164e63"

},

{

date:"2026-10-31T00:00:00",

end:"2026-11-01T00:00:00",

name:"Halloween",

emoji:"🎃",

bg:"#241006"

},

{

date:"2026-11-11T00:00:00",

end:"2026-11-12T00:00:00",

name:"Veterans Day",

emoji:"🇺🇸",

bg:"#450a0a"

},

{

date:"2026-11-26T00:00:00",

end:"2026-11-27T00:00:00",

name:"Thanksgiving",

emoji:"🦃",

bg:"#431407"

},

{

date:"2026-12-24T00:00:00",

end:"2026-12-25T00:00:00",

name:"Christmas Eve",

emoji:"🎅",

bg:"#064e3b"

},

{

date:"2026-12-25T00:00:00",

end:"2026-12-26T00:00:00",

name:"Christmas",

emoji:"🎄",

bg:"#052e16"

},

{

date:"2026-12-31T00:00:00",

end:"2027-01-01T00:00:00",

name:"New Year's Eve",

emoji:"🎉",

bg:"#1e1b4b"

}

];

const newYear = {

date:"2027-01-01T00:00:00",

end:"2027-01-02T00:00:00",

name:"New Year's Day",

emoji:"🎆",

bg:"#172554"

};

function getCurrentHoliday() {

const now = new Date();

return holidays.find(h =>

now >= new Date(h.date) &&

now < new Date(h.end)

);

}

function getNextHoliday() {

const now = new Date();

return holidays.find(h =>

new Date(h.date) > now

);

}

function formatTime(ms) {

if (ms < 0) ms = 0;

let total = Math.floor(ms / 1000);

let days = Math.floor(total / 86400);

total %= 86400;

let hours = Math.floor(total / 3600);

total %= 3600;

let minutes = Math.floor(total / 60);

let seconds = total % 60;

return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m ${String(seconds).padStart(2,"0")}s`;

}

function update() {

const now = new Date();

let current = getCurrentHoliday();

let next = getNextHoliday();

// If a holiday is happening right now,

// show that holiday as the theme.

if (current) {

document.body.style.background = current.bg;

document.getElementById("emoji").textContent = current.emoji;

document.getElementById("name").textContent = current.name;

document.getElementById("timer").textContent =

"🎉 TODAY! 🎉";

document.getElementById("date").textContent =

new Date(current.date).toLocaleDateString(undefined,{

weekday:"long",

month:"long",

day:"numeric",

year:"numeric"

});

return;

}

// If there are no more holidays this year,

// show New Year's Day.

if (!next) {

next = newYear;

}

// Background changes to the NEXT holiday.

document.body.style.background = next.bg;

document.getElementById("emoji").textContent = next.emoji;

document.getElementById("name").textContent = next.name;

document.getElementById("timer").textContent =

formatTime(new Date(next.date) - now);

document.getElementById("date").textContent =

new Date(next.date).toLocaleDateString(undefined,{

weekday:"long",

month:"long",

day:"numeric",

year:"numeric"

});

}

// Create the holiday list.

const list = document.getElementById("holidayList");

holidays.forEach(h => {

const div = document.createElement("div");

div.className = "holiday";

div.innerHTML = `

<span>${h.emoji}</span>

<strong>${h.name}</strong>

<small>

${new Date(h.date).toLocaleDateString(undefined,{

month:"long",

day:"numeric"

})}

</small>

`;

list.appendChild(div);

});

update();

setInterval(update,1000);

</script>

</body>

</html>
