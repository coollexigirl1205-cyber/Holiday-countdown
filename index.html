<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday Countdown</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  transition: background 1s ease;
  background: #4c1d95;
}

main {
  width: min(1000px, 94%);
  margin: auto;
  padding: 25px 0 50px;
  text-align: center;
}

.today {
  text-align: right;
  font-size: 16px;
  font-weight: 600;
  opacity: 0.75;
  margin-bottom: 10px;
}

.card {
  padding: 35px 22px;
  border-radius: 30px;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.emoji {
  font-size: 70px;
}

.label {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 3px;
  opacity: 0.9;
}

.name {
  font-size: clamp(42px, 8vw, 75px);
  font-weight: 900;
  margin: 8px 0;
}

.timer {
  font-size: clamp(30px, 7vw, 60px);
  font-weight: 900;
  margin: 15px 0;
}

.date {
  font-size: 20px;
  opacity: 0.9;
}

h2 {
  margin-top: 45px;
  font-size: 30px;
}

.holidays {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-top: 20px;
}

.holiday {
  padding: 18px;
  border-radius: 22px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
}

.holiday span {
  display: block;
  font-size: 35px;
}

.holiday strong {
  display: block;
  margin-top: 7px;
  font-size: 17px;
}

.holiday small {
  display: block;
  opacity: 0.8;
  margin-top: 5px;
}

.holiday .countdown {
  margin-top: 10px;
  font-weight: 700;
  font-size: 14px;
}

.special {
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
}

.next {
  margin-top: 25px;
  opacity: 0.8;
  font-size: 15px;
}
</style>
</head>

<body>

<main>

<div class="today" id="today"></div>

<section class="card">
  <div class="emoji" id="emoji"></div>
  <div class="label" id="label">NEXT HOLIDAY</div>
  <div class="name" id="name"></div>
  <div class="timer" id="timer"></div>
  <div class="date" id="date"></div>

  <div class="next">
    ✨ Countdown updates every second ✨
  </div>
</section>

<h2>🎉 Upcoming Holidays</h2>

<div class="holidays" id="holidayList"></div>

</main>

<script>

const holidays = [

  {
    date: "2026-09-07T00:00:00",
    end: "2026-09-08T00:00:00",
    name: "Labor Day",
    emoji: "👷",
    bg: "#312e81"
  },

  {
    date: "2026-09-22T00:00:00",
    end: "2026-09-23T00:00:00",
    name: "First Day of Fall",
    emoji: "🍂",
    bg: "#7c2d12"
  },

  {
    date: "2026-10-12T00:00:00",
    end: "2026-10-13T00:00:00",
    name: "Columbus Day",
    emoji: "⛵",
    bg: "#164e63"
  },

  {
    date: "2026-10-31T00:00:00",
    end: "2026-11-01T00:00:00",
    name: "Halloween",
    emoji: "🎃",
    bg: "#3b0764"
  },

  {
    date: "2026-11-11T00:00:00",
    end: "2026-11-12T00:00:00",
    name: "Veterans Day",
    emoji: "🇺🇸",
    bg: "#450a0a"
  },

  {
    date: "2026-11-26T00:00:00",
    end: "2026-11-27T00:00:00",
    name: "Thanksgiving",
    emoji: "🦃",
    bg: "#431407"
  },

  {
    date: "2026-12-21T00:00:00",
    end: "2026-12-22T00:00:00",
    name: "First Day of Winter",
    emoji: "❄️",
    bg: "#172554"
  },

  {
    date: "2026-12-24T00:00:00",
    end: "2026-12-25T00:00:00",
    name: "Christmas Eve",
    emoji: "🎅",
    bg: "#064e3b"
  },

  {
    date: "2026-12-25T00:00:00",
    end: "2026-12-26T00:00:00",
    name: "Christmas",
    emoji: "🎄",
    bg: "#052e16"
  },

  {
    date: "2026-12-31T00:00:00",
    end: "2027-01-01T00:00:00",
    name: "New Year's Eve",
    emoji: "🎉",
    bg: "#1e1b4b"
  }

];

const newYearsDay = {
  date: "2027-01-01T00:00:00",
  end: "2027-01-02T00:00:00",
  name: "New Year's Day",
  emoji: "🎆",
  bg: "#172554"
};

function getCurrentHoliday() {

  const now = new Date();

  return holidays.find(h =>
    now >= new Date(h.date) &&
    now < new Date(h.end)
  );
}

function getNextHoliday() {

  const now = new Date();

  return holidays.find(h =>
    new Date(h.date) > now
  );
}

function formatTime(ms) {

  if (ms < 0) ms = 0;

  let total = Math.floor(ms / 1000);

  const days = Math.floor(total / 86400);
  total %= 86400;

  const hours = Math.floor(total / 3600);
  total %= 3600;

  const minutes = Math.floor(total / 60);
  const seconds = total % 60;

  return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m ${String(seconds).padStart(2,"0")}s`;
}

function formatDate(date) {

  return new Date(date).toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

function updateToday() {

  const now = new Date();

  document.getElementById("today").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });
}

function updateBigCard() {

  const now = new Date();

  let current = getCurrentHoliday();
  let next = getNextHoliday();

  /*
    If today is a holiday,
    show that holiday on the big screen.
  */

  if (current) {

    document.body.style.background = current.bg;

    document.getElementById("emoji").textContent = current.emoji;

    document.getElementById("label").textContent =
      "TODAY";

    document.getElementById("name").textContent =
      current.name;

    document.getElementById("timer").textContent =
      "🎉 TODAY! 🎉";

    document.getElementById("date").textContent =
      formatDate(current.date);

    return;
  }

  /*
    Otherwise show the next upcoming holiday.
  */

  if (!next) {
    next = newYearsDay;
  }

  document.body.style.background = next.bg;

  document.getElementById("emoji").textContent =
    next.emoji;

  document.getElementById("label").textContent =
    "NEXT HOLIDAY";

  document.getElementById("name").textContent =
    next.name;

  document.getElementById("timer").textContent =
    formatTime(new Date(next.date) - now);

  document.getElementById("date").textContent =
    formatDate(next.date);
}

function updateHolidayList() {

  const now = new Date();

  const list = document.getElementById("holidayList");

  list.innerHTML = "";

  /*
    Only show holidays that have NOT passed.
  */

  const upcoming = holidays.filter(h =>
    new Date(h.date) > now
  );

  upcoming.forEach(h => {

    const div = document.createElement("div");

    div.className = "holiday";

    div.innerHTML = `
      <span>${h.emoji}</span>

      <strong>${h.name}</strong>

      <small>
        ${new Date(h.date).toLocaleDateString(undefined,{
          month:"long",
          day:"numeric",
          year:"numeric"
        })}
      </small>

      <div class="countdown" data-date="${h.date}">
        ${formatTime(new Date(h.date) - now)}
      </div>
    `;

    list.appendChild(div);

  });
}

function updateSmallCountdowns() {

  const now = new Date();

  document.querySelectorAll(".countdown").forEach(el => {

    const target = new Date(el.dataset.date);

    if (target <= now) {
      el.parentElement.remove();
      return;
    }

    el.textContent =
      formatTime(target - now);

  });
}

function update() {

  updateToday();
  updateBigCard();

  /*
    Rebuild the list so passed holidays disappear.
  */

  updateHolidayList();

}

update();

setInterval(() => {

  updateToday();
  updateBigCard();
  updateSmallCountdowns();

}, 1000);

</script>

</body>
</html>
